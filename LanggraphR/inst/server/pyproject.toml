[project]
name = "langgraphr-server"
version = "0.2.0"
description = "Hidden LangGraph server bundle embedded in the langgraphr R package"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[tool.uv]
package = false
