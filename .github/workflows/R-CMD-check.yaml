# Workflow: run the langgraphr test suite on push and pull requests.
# The graph-path tests need no model or API key, so CI is free.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        r-version: ['release']
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::LanggraphR
      - name: Install Python server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r LanggraphR/inst/server/requirements.txt
      - name: Run tests
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: testthat::test_local("LanggraphR")
        shell: Rscript {0}
